# One Android runtime for the whole Compose UI tier.
#
# Pinned rather than left to default to `targetSdk` so the suite is reproducible
# on any machine: Robolectric downloads exactly one `android-all-instrumented`
# artifact instead of one per developer's SDK state, and the qualifiers below
# fix the density and screen size every layout assertion is written against
# (`assertWidthIsEqualTo` compares dp, which needs a known density).
sdk=34
qualifiers=w411dp-h891dp-xhdpi

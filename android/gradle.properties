org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The fixture oracle compares UTF-8 bytes; keep every JVM in the build on UTF-8
# regardless of the host locale.
kotlin.daemon.jvmargs=-Xmx1g -Dfile.encoding=UTF-8

kotlin.code.style=official

# `:app` (the Compose module) only — inert for the pure Kotlin/JVM modules.
# AGP requires these to be set on the ROOT project; they cannot live in
# app/build.gradle.kts.
android.useAndroidX=true
android.nonTransitiveRClass=true
